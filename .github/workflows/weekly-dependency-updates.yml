name: Weekly dependency updates

on:
  schedule:
    # 9:00 PM Sunday in America/Bogota. Colombia does not observe daylight saving time.
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-dependency-updates
  cancel-in-progress: false

jobs:
  update:
    name: Check and update dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check for an existing update pull request
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open_pr_count="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --state open \
              --json headRefName \
              --jq 'map(select(.headRefName | startswith("codex/weekly-dependency-updates-"))) | length'
          )"

          if [[ "$open_pr_count" -gt 0 ]]; then
            echo "An automated dependency update pull request is already open."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the OpenAI API key
        if: steps.preflight.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::Add OPENAI_API_KEY as a repository Actions secret."
            exit 1
          fi

      - name: Check out main
        if: steps.preflight.outputs.should_run == 'true'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        if: steps.preflight.outputs.should_run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        if: steps.preflight.outputs.should_run == 'true'
        run: bun install --frozen-lockfile

      - name: Prepare trusted Codex configuration
        if: steps.preflight.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          codex_home="/tmp/codex-home"
          mkdir -p "$codex_home"
          cp .github/codex/config.toml "$codex_home/config.toml"

      - name: Update dependencies with Codex
        if: steps.preflight.outputs.should_run == 'true'
        id: codex
        uses: openai/codex-action@f367b1e9572fd064ea71ef925ca24ee0f01080af # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/dependency-updates.md
          codex-home: /tmp/codex-home
          codex-version: 0.149.1
          permission-profile: dependency-updates
          safety-strategy: drop-sudo
          codex-args: '["--search"]'
          model: gpt-5.6-sol
          effort: high

      - name: File the dependency update pull request
        if: steps.preflight.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ steps.codex.outputs.final-message }}
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Dependencies are already current."
            exit 0
          fi

          if [[ -n "$(git status --porcelain -- .github/codex .github/workflows/weekly-dependency-updates.yml)" ]]; then
            echo "::error::Codex modified protected automation files."
            exit 1
          fi

          git diff --check

          branch="codex/weekly-dependency-updates-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update dependencies"

          gh auth setup-git
          git push --set-upstream origin "$branch"

          if [[ -z "${PR_BODY//[[:space:]]/}" ]]; then
            PR_BODY="Scheduled dependency review found safe updates. See the commit diff for details."
          fi

          pr_body_file="$RUNNER_TEMP/dependency-update-pr.md"
          printf '%s\n' "$PR_BODY" > "$pr_body_file"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$branch" \
            --title "chore: keep dependencies current" \
            --body-file "$pr_body_file"
