name: Publish package

on:
  push:
    branches:
      - main

concurrency:
  group: publish-package
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          path: create-app

      - name: Check out the pinned template
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: starter-boilerplate
          ref: 0ef17563793d2b4391e7a501f4f5dd5960325692
          repository: mrk-us/starter-boilerplate

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile
        working-directory: create-app

      - name: Install pinned template dependencies
        run: bun install --frozen-lockfile
        working-directory: starter-boilerplate

      - name: Validate package
        run: bun run validate
        working-directory: create-app

      - name: Check package version
        id: package
        shell: bash
        working-directory: create-app
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          if released_commit="$(npm view "${package_name}@${package_version}" gitHead 2>/dev/null)"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published."
            # TEMPLATE_COMMIT is in src/generate.ts, so this also covers the template pin.
            if ! git diff --quiet "${released_commit}" HEAD -- src; then
              echo "::warning::${package_name}@${package_version} is already published, but src/ or the template pin changed since that release. Bump the version in package.json to publish the changes."
            fi
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        if: steps.package.outputs.publish == 'true'
        run: npm publish --access public --provenance
        working-directory: create-app
